<svg width="100%" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <style>
      .pulse-line {
        stroke: url(#glow);
        stroke-width: 3;
        fill: none;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: dash 4s linear infinite;
      }
      .floating-circle {
        animation: float 6s ease-in-out infinite;
      }
      .floating-circle-reverse {
        animation: float-reverse 7s ease-in-out infinite;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes float-reverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(10px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" rx="12" fill="url(#bg)"/>

  <!-- Dynamic/Animated Background Elements -->
  <g opacity="0.25">
    <circle cx="150" cy="50" r="80" fill="#3b82f6" class="floating-circle"/>
    <circle cx="750" cy="170" r="100" fill="#8b5cf6" class="floating-circle-reverse"/>
    <circle cx="820" cy="40" r="40" fill="#06b6d4" class="floating-circle"/>
  </g>

  <!-- EKG Heartbeat Pulse Wave (Dynamic Element behind text) -->
  <path class="pulse-line" d="M 0 140 L 200 140 L 220 110 L 235 170 L 255 70 L 275 160 L 290 125 L 305 140 L 600 140 L 615 120 L 630 160 L 645 80 L 665 175 L 680 120 L 695 140 L 900 140" opacity="0.5"/>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle" filter="url(#shadow)">
    <!-- Main Title -->
    <text x="450" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="34" fill="#ffffff" letter-spacing="1">
      🩺 Awesome Chronic Care Management 🏥
    </text>
    
    <!-- Subtitle -->
    <text x="450" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="16" fill="#93c5fd" letter-spacing="0.5">
      Curated List of CCM Platforms, Medicare RPM, Care Coordination &amp; FHIR eCare Planning
    </text>

    <!-- Tagline / Pills in foreground -->
    <g transform="translate(450, 180)">
      <rect x="-180" y="-15" width="110" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="-125" y="1" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">SaaS Ecosystem</text>

      <rect x="-55" y="-15" width="110" height="24" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
      <text x="0" y="1" font-family="sans-serif" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">Open-Source FHIR</text>

      <rect x="70" y="-15" width="110" height="24" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
      <text x="125" y="1" font-family="sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">Medicare Billing</text>
    </g>
  </g>
</svg>
